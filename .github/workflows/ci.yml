name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.202

      - name: Restore
        run: dotnet restore Zenith.slnx

      - name: Build
        run: dotnet build Zenith.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Zenith.slnx --configuration Release --no-build --no-restore
